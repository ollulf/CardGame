match: 1
	dialogues:
		when: start
		lines:
			1: Lets play some *cards*, shall we?
			2: Alright, how did it work again?.
			1: Everybody got their own *deck* with them?
			cue: show_deck
			2: Yes! Now, everybody draws *5 cards*, if I remember correctly.
			cue: deal_cards
			1: Okay *YOU*, play a card now.
			wait_for_cards_played: 1
			1: I have to *follow your played suit*, and if I can't, I can *play whatever I want.*
			2: Ahh and there was a *trump color* that is *always higher*, right?
			1: Yes.
			wait_for_cards_played: 1
			1: I think my card will be the highest no matter what you play.
			2: We will see...

		when: turn_end
		round: 1
		turn: 1
		lines:
			cue: show_won_turns
			1: This was the first turn. Now the *winner* plays the *first card.*
			1: After we played *5 turns* and nobody has hand cards anymore the players
				with the *least won turns* looses the round.

		when: round_end
		round: 1
		lines:
			cue: show_life_cards
			2: Well, that makes me the *looser*... I have to rip one of the two *life cards* now.
			2: If I loose one more time I *loose* the whole *game*.
			2: But since I lost, I will get us a round of *drinks*.
			1: Awesome idea... Cheers!
			1: Alright, next round!

match: any
	dialogues:
		when: round_end
		lines:
			1: Light up. *Next round.*

		when: end
		lines:
			1: That's it. *Out of lives.*
