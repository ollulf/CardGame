match: 1
	dialogues:
		when: match_start
		lines:
			1: ...
			1: Well...
			1: Let's play some *cards*. What do you say *Manfred*?
			2: Alright *Bernd*, we were out of topics anyways.
			1: Everybody got their own *deck* with them?
			cue: show_deck
			cue: deal_cards
			1: Okay *{player}*, play a card now.
			wait_for_cards_played: 2
			1: Nobody can beat my *hearts 9*.
			2: Yeah, I cannot beat that...

		when: turn_end
		round: 1
		turn: 1
		lines:
			cue: show_won_turns
			1: This was the first turn and I was the *winner*. I will play the next *first card.*
			wait_for_cards_played: 2
			2: No *hearts* for me... again.

		when: round_end
		round: 1
		lines:
			cue: show_life_cards
			2: Well, that makes me the *loser*...
			2: But since I lost, I will get us a round of *drinks*.
			1: Awesome idea *Manfred*... 
			1: Cheers!
			2: Cheers.
			cue: show_drink_round
			1: Alright, next round!

		when: turn_start
		round: 2
		turn: 2
		lines: 
			1: *{player}* you are doing great!
			1: This is *fun*.
			2: Shush, *Bernd*! *{player}* is not a child.
			1: Yes, yes...

		when: turn_start
		round: 2
		turn: 4
		lines: 
			1: I will *smoke* a *cigarette* if that is fine for everybody.
			cue: show_cigs
			2: Sure, I would also smoke one.
			cue: ai_one_smokes
			2: Can I use your *lighter*?
			1: Sure, here you go.
			cue: ai_two_smokes

		when: round_start
		round: 3
		lines:
			wait_for_cards_played: 2
			2: Finally I am drawing my *smoking* cards.

		when: turn_start
		round: 3
		turn: 3
		lines:
			1: Well, beat *this*!
			wait_for_cards_played: 1
			2: I will, by *smoking a cigarette*!

		when: match_end
		lines:
			cue: show_purse
			1: Well, this was the first match and I lost...
			2: Let's count this as the *trial round*, hehe.

match: 2
	dialogues:
		when: match_start
		lines:
			2: Alright, let's spice it up and play with some *money*!
			1: Sounds good! Since I lost last round I have to put in the *prize money*.
			cue: ai_1_pays
			1: Let's hope it's not me again...
			wait_for_cards_played: 1
			1: Ahh *{player}* ...
			cue: give_player_cigs 3
			1: Have some of my *cigarettes*.
			1: I hope you already added *smoking cards* to your *deck*.
			2: I hope not...
			2: That's going to make it harder for us, to win.

		when: zero_played
		lines:
			2: See that *0*? Those are in our decks now.
			1: I know, I know. That's why I keep my *9s* away from it.
			2: Hehe, then you'd better watch your *9s*.

		when: round_start
		round: 2
		lines:
			cue: unlock_cig_automat
			Bar: Jo guys, the *cigarette machine* works again, in case somebody needs more.
			1: Awesome, I ran out of *cigarettes*. Let me quickly buy some.
			cue: ai_1_buys_cigarettes

		when: zero_beats_nine
		lines:
			1: Ugh, I knew it, and I still fell for it.
			1: Fine, fine. Next time I'll keep my *0s* for the big ones.

match: 3
	dialogues:
		when: match_start
		lines:
			2: Okay, cigarettes are nice, but a bar game needs *drinks*!
			cue: show_drinks
			2: So watch out, *we* can order rounds too!

		when: alk_played
		lines:
			1: A *drinking card*! Somebody came thirsty.

		when: match_end
		lines:
			1: Phew, my *hearts 7* looked like a *5* after those drinks.
			2: If *YOU* like drinking, check the shop next time. The *boosters* have *drinking cards* now.

match: any
	dialogues:
		when: match_end
		lines:

		when: tie_played
		lines:
			1: Wait, we both played the same card. Who wins now?
			2: Hehe, being *first* has its perks.

		when: round_tie
		lines:
			1: Hold on, there is a *tie* for the *fewest won turns*. Who loses the round now?
			2: Tie-break! Let's *draw*.
