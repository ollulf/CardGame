match: 1
	dialogues:
		when: match_start
		lines:
			1: Let's play some *cards*, shall we?
			2: Alright, how did it work again?
			1: Everybody got their own *deck* with them?
			cue: show_deck
			2: Yes! Now, everybody draws *5 cards*, if I remember correctly.
			cue: deal_cards
			1: Okay *YOU*, play a card now.
			1: Your goal is to have the *highest card*, after everybody played *one card*.
			wait_for_cards_played: 1
			1: I have to *follow* your *played suit* if I have a card on my hand with that *suit.*
			1: If I don't have it, my other cards of a *different suit* are *worthless*.
			1: That means the *highest* card of the *first played suit* wins the turn.
			2: ... unless ...
			2: Unless it's of the *trump color*, that is *always higher*, right?
			1: But the *trump* is picked *at random* every round.
			1: Yes.
			1: But in that case, the *highest trump* card *wins*.
			wait_for_cards_played: 1
			1: Nobody can beat my *hearts 9*.
			1: Since it's *trump* for this round, it's the *highest*.
			2: Yeah, I cannot beat that...
			2: And if I have the *first played suit*, I have to play that.

		when: turn_end
		round: 1
		turn: 1
		lines:
			cue: show_won_turns
			1: This was the first turn and I was the *winner*. I will play the next *first card.*
			1: After we played *5* turns, the players with the *least* won *turns* loses the round.
			wait_for_cards_played: 1
			1: Since, I played *hearts* now, and it's *trump* everybody who has trump, has to *play trump* now too.
			wait_for_cards_played: 1
			2: I don't have *hearts*, so I have to play something different.

		when: round_end
		round: 1
		lines:
			cue: show_life_cards
			2: Well, that makes me the *loser*... I have to rip one of the two *life cards* now.
			2: If I lose one more time I *lose* the whole *game*.
			2: But since I lost, I will get us a round of *drinks*.
			cue: show_drink_round
			1: Awesome idea... 
			1: Cheers!
			2: Cheers.
			1: Alright, next round!

		when: round_start
		round: 2
		lines:
			2: Ahh, important to say is that the *cards* from the *last round* stay out of the game.
			2: We will draw *5 new cards* from our *deck*.
			2: We will get all of them back *after* the game.
			1: I think *YOU* got it, right?
			1: Let's continue!

		when: turn_start
		round: 2
		turn: 2
		lines: 
			1: *YOU* are doing great!
			1: This is *fun*.
			2: Yeah, I also remember everything and *enjoy* it!

		when: turn_start
		round: 2
		turn: 4
		lines: 
			1: I will *smoke* a *cigarette* if that is fine for everybody.
			cue: show_cigs
			2: Sure, I would also smoke one.
			cue: ai_one_smokes
			2: Can I use your *lighter*?
			1: Sure, here you go.
			cue: ai_two_smokes

		when: round_start
		round: 3
		lines:
			wait_for_cards_played: 2
			2: Finally I am drawing my *smoking* cards.
			2: It basically is *always* a *trump* card.
			1: But if *YOU* would play a *higher diamonds* trump card now, *YOU* would win this turn.

		when: turn_start
		round: 3
		turn: 3
		lines:
			1: Well, beat *this*!
			wait_for_cards_played: 1
			2: I will, by *smoking a cigarette*, which makes *only* my *cigarette cards stronger* for every cigarette smoked this round.

		when: match_end
		lines:
			cue: show_purse
			1: Well, this was the first match and I lost...
			2: Let's count this as the *trial round*, but *YOU* can *buy* yourself a *booster*.
			2: With them you can *upgrade your deck* to keep up with us, hehe

match: 2
	dialogues:
		when: match_start
		lines:
			2: Alright, let's spice it up and play with some *money*!
			1: Sounds good! Since I lost last round I have to put in the *prize money*.
			cue: ai_1_pays
			1: The *prize money* is *split* between the two *winners*.
			2: And the *new loser* has to *pay* for the next round.
			1: Let's hope it's not me again...
			wait_for_cards_played: 1
			1: Ahh *YOU* ...
			cue: give_player_cigs 3
			1: Have some of my *cigarettes*. You can smoke them whenever you want.
			1: I hope you already added *smoking cards* to your *deck*.
			2: I hope not...
			2: That's going to make it harder for us, to win.
			1: Oh, and one more thing: from now on our *decks* also have *0s* in them.
			2: Don't laugh at them. A *0* is not as *worthless* as it looks...
			1: Shh, don't spoil it! *YOU* will see.

		when: zero_played
		lines:
			2: There it is, the first *0* of the match!
			1: Looks harmless, right? Good thing my *9* is safe.
			2: Hehe, I'm saying nothing.

		when: round_start
		round: 2
		lines:
			cue: unlock_cig_automat
			Bar: Jo guys, the cigarette machine works again, in case somebody needs more.
			1: Awesome, I ran out of cigarettes. Let me quickly buy some.
			cue: ai_1_buys_cigarettes

		when: zero_beats_nine
		lines:
			1: Wait what? A *0* just took the turn from a *9*?
			2: Hehe, yes! A *0* beats a *9 or higher*, but only of the *same suit*.
			2: So only a *trump 0* beats a *trump 9*, and a *hearts 0* cannot beat a *smoking 9*.
			1: So the tiny ones are dangerous... I should keep mine for the big ones.

match: 3
	dialogues:
		when: match_start
		lines:
			2: Okay, cigarettes are nice, but a bar game needs *drinks*!
			cue: show_drinks
			1: From now on there are *drinking cards* in the decks, the ones with the *glass*.
			2: Just like *smoking cards*, they are *always trump*.
			2: And we slipped *3 drinking cards* into *YOUR* deck, just for this match.
			1: Drinks come from the *bar*: a *Round of Drinks* costs *$5*.
			2: Then *everybody* at the table has to *drink*, whether they like it or not.
			2: A drink gives *all* your *drinking cards +1*, but *all* your *other cards -1*.
			1: And it lasts the *whole match*, not just the round. Two rounds, it stacks!
			2: The *$* next to us is our money. So watch out, *we* can order rounds too!

		when: alk_played
		lines:
			1: A *drinking card*! Somebody came thirsty.
			2: Careful, it's *trump*, and it only gets *stronger* with every *drink*.
			1: And everything else gets a bit *blurry*, hehe.

		when: match_end
		lines:
			1: Phew, my *hearts 7* looked like a *5* after those drinks.
			2: Those *3 drinking cards* were only borrowed, by the way.
			2: If *YOU* like drinking, check the shop next time. There is a *Drinking Booster* with *drinking cards*.
			1: And remember the *Round of Drinks*: *everybody* drinks...
			2: ...including the ones without drinking cards. Hehe.

