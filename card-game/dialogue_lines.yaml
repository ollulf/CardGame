match: 1
	dialogues:
		when: match_start
		lines:
			1: ...
			1: Well...
			1: Let's play some *cards*. What do you say *Manfred*?
			2: Alright *Bernd*, we were out of topics anyways.
			1: Out of topics? You never had any. Everybody brought a *deck*?
			cue: show_deck
			cue: deal_cards
			1: Go on *{player}*, you start. We don't bite.
			2: He bites. Mostly the *ashtray*.
			wait_for_cards_played: 2
			1: Ha! My *hearts 9*. Read it and weep.
			2: Thirty years and he still gloats like it's the first time.

		when: turn_end
		round: 1
		turn: 1
		lines:
			cue: show_won_turns
			1: First *Bierdeckel* of the night. Somebody frame it.
			2: Somebody frame his face when he loses.
			wait_for_cards_played: 2
			2: No *hearts* for me... again.

		when: round_end
		round: 1
		lines:
			cue: show_life_cards
			2: Well, that makes me the *loser*...
			2: Fine. Tradition is tradition. I'm getting the *drinks*.
			1: Awesome idea *Manfred*... 
			1: Cheers!
			2: Cheers.
			cue: show_drink_round
			1: Alright, next round!

		when: turn_start
		round: 2
		turn: 2
		lines: 
			1: *{player}* you are doing great!
			1: This is *fun*.
			2: Shush, *Bernd*! *{player}* is not a child.
			1: Yes, yes...

		when: turn_start
		round: 2
		turn: 4
		lines: 
			1: I will *smoke* a *cigarette* if that is fine for everybody.
			cue: show_cigs
			2: Sure, I would also smoke one.
			cue: ai_one_smokes
			2: Can I use your *lighter*?
			1: Again? Buy your own one day.
			cue: ai_two_smokes

		when: round_start
		round: 3
		lines:
			wait_for_cards_played: 2
			2: Finally, the good stuff.
			1: You say that about everything that burns.

		when: turn_start
		round: 3
		turn: 3
		lines:
			1: Well, beat *this*!
			wait_for_cards_played: 1
			2: Hold that thought, Bernd. This calls for a *cigarette*.

		when: match_won
		lines:
			cue: show_purse
			1: Well, this was the first match and I lost...
			2: Let's count this as the *trial round*, hehe.

		when: match_lost
		lines:
			1: Ha! I won one! Manfred, write it down.
			2: Next to the other one. From 1994.

		when: run_lost
		lines:
			1: Hey, no shame, *{player}*. First night at this table.
			2: First night is free. After that we take it personally.
			1: Grab a drink and sit back down. The chair's not going anywhere.

match: 2
	dialogues:
		when: match_start
		lines:
			2: Alright, let's make it interesting. Real *money* this time.
			1: And of course *I* pay in. Last night's loser.
			cue: ai_1_pays
			1: Let's hope it's not me again...
			wait_for_cards_played: 1
			1: Ahh *{player}* ...
			cue: give_player_cigs 3
			1: Have some of my *cigarettes*. On the house.
			2: His house. Which is mostly this bar.
			1: Hope you packed some *smoking cards*, {player}.
			2: Don't encourage the kid. We want to *win*.

		when: zero_played
		lines:
			2: Ooh, a *0*. Careful with your *9s*, Bernd.
			1: Don't start. I didn't sleep for a week last time.
			2: Best week of my life.

		when: round_start
		round: 2
		lines:
			cue: unlock_cig_automat
			Bar: Jo guys, the *cigarette machine* works again, in case somebody needs more.
			1: Awesome, I ran out of *cigarettes*. Let me quickly buy some.
			cue: ai_1_buys_cigarettes
			2: You bought a pack yesterday.
			1: And it's a new day, Manfred.

		when: zero_beats_nine
		lines:
			1: Ugh, I knew it, and I still fell for it.
			2: Every time, Bernd. Every single time.

		when: match_won
		lines:
			1: Well. There goes the *pot*.
			2: Into *{player}*'s pocket. Spend it wisely.
			1: Spend it *here*, he means.

		when: match_lost
		lines:
			2: And the money stays at the table. As it should.
			1: Easy come, easy go, *{player}*.

		when: run_lost
		lines:
			1: Don't look so sad. It's only money.
			2: Says the man who owes the *cigarette machine* three euros.
			1: Here, one for the road. Helps, trust me.
			2: Everything helps, according to him.

match: 3
	dialogues:
		when: match_start
		lines:
			2: Cigarettes alone are a sad hobby. Let's get some *drinks* going.
			cue: show_drinks
			1: Says the man who orders before he sits down.
			2: I'm efficient.

		when: alk_played
		lines:
			1: A *drinking card*! Somebody came thirsty.

		when: match_won
		lines:
			1: Phew, my *hearts 7* looked like a *5* after those drinks.
			2: The *boosters* have *drinking cards* now, {player}. Just saying.
			1: He's recruiting. Don't listen to him.

		when: match_lost
		lines:
			1: Out! Bartender, that one's on me!
			2: Everything's on you, Bernd. That's why you're broke.

		when: run_lost
		lines:
			2: Leaving already? The night's still young.
			1: The night's always young in here. We're the ones who got old.
			2: Go sleep it off, *{player}*. We'll save your glass.
			1: Don't save it. I'll drink it.

match: 4
	dialogues:
		when: match_start
		lines:
			1: *{player}*! Sit, sit. We kept your chair warm.
			2: He kept the *ashtray* warm.
			cue: ai_one_smokes
			1: First one of the evening. Doesn't count.
			2: You said that about the last three.
			1: Here *{player}*, have a few. Nobody smokes alone at this table.
			cue: give_player_cigs 2
			2: Leave the kid alone, Bernd.
			2: ...unless the kid is buying.

		when: round_start
		round: 2
		lines:
			2: Bartender! Same again. And one for *{player}*.
			1: Manfred, it's barely dark outside.
			2: It's dark somewhere.

		when: turn_start
		round: 2
		turn: 3
		lines:
			1: Where's my *lighter*? Who took my lighter?
			2: It's in your hand, Bernd.
			1: ...I knew that. I was testing you.

		when: round_start
		round: 3
		lines:
			1: Just this round. Then I'm switching to *water*.
			2: He's been switching to water since 1998.
			1: Water's for fish, Manfred.

		when: zero_played
		lines:
			2: A *0*! Bernd, your *9s*...
			1: Can't hear you. I'm *smoking*.

		when: alk_played
		lines:
			2: Now we're talking. *{player}*, that could be you.
			1: Leave it, Manfred. ...Or don't.

		when: match_won
		lines:
			2: Same time tomorrow?
			1: Same time every day, Manfred. That's the problem.
			1: Tomorrow's the big one, *{player}*. Bring your thirst.

		when: match_lost
		lines:
			1: Out. Ha. Out...
			2: Don't gloat, Bernd. Your hands are shaking.

		when: run_lost
		lines:
			1: Wait, *{player}*. Sit. One more. Just one.
			2: Leave it. They've got somewhere to be.
			1: Somewhere. Huh. Remember having somewhere, Manfred?
			2: No.
			Bar: Same again, gentlemen?
			2: Same again.

match: 5
	dialogues:
		when: match_start
		lines:
			Bar: Last round tonight, gentlemen. And I mean it this time.
			1: Says that every night.
			2: Big pot tonight. Bernd's whole *pension*.
			1: Half of it. The other half is in that *ashtray*.
			cue: ai_two_smokes
			2: *{player}*, one with us. For luck. One won't kill you.
			1: Won't kill you *fast*, anyway.
			cue: give_player_cigs 3

		when: round_start
		round: 2
		lines:
			cue: show_drink_round
			2: Round's on me. Don't look at me like that, Bernd.
			1: I'm not looking. I'm *counting*.
			2: *{player}*, you're not drinking? You make us look bad.

		when: turn_start
		round: 2
		turn: 4
		lines:
			1: My hands are shaking. It's the cards. Cheap cards.
			2: It's not the cards, Bernd.
			1: ...Pass me a *cigarette*.

		when: round_start
		round: 3
		lines:
			1: You're good, *{player}*. Too good. Have a *drink*, even it out.
			2: Come on. It's warmer over here with us.

		when: alk_played
		lines:
			1: Ahh, *drinking cards*. My people.
			2: Your only people, Bernd.

		when: match_won
		lines:
			1: Well... beaten by the new kid.
			2: Thirty years at this table, and the kid takes the pot.

		when: match_lost
		lines:
			2: That's it, then.
			1: Pot stays here. Like us.

		when: run_lost
		lines:
			Bar: That's you done, *{player}*. Go home.
			1: Home? It's warm here. Stay. Watch, at least.
			cue: ai_one_smokes
			2: Look at them, Bernd. Halfway out the door.
			1: We were like that once.
			2: Same chair tomorrow, *{player}*. You know where.
			1: Everybody comes back. That's the thing about this table.

match: any
	dialogues:
		when: match_won
		lines:

		when: tie_played
		lines:
			1: Same card? *Copycat*.
			2: I played it *first*. You're the copycat.

		when: round_tie
		lines:
			1: A *tie*? Not again...
			2: Shut up and *draw*, Bernd.

		when: run_won
		lines:
			Bar: Closing time, boys.
			1: Already? *{player}*, stay. One more game. One more *drink*.
			2: Let them go, Bernd.
			1: I am. I'm just asking.
			cue: ai_one_smokes
			2: ...Same table tomorrow, *{player}*?
			1: We'll be here. We're always here.
