match: 1
	dialogues:
		when: match_start
		lines:
			1: ...
			1: Well...
			1: Let's play some *cards*. What do you say *Manfred*?
			2: Alright *Bernd*, we were out of topics anyways.
			1: Out of topics? You never had any. Everybody brought a *deck*?
			cue: show_deck
			cue: deal_cards
			1: Go on *{player}*, you start. We don't bite.
			2: He bites. Mostly the *ashtray*.
			wait_for_cards_played: 2
			1: Ha! My *hearts 9*. Read it and weep.
			2: Thirty years and he still gloats like it's the first time.

		when: turn_end
		round: 1
		turn: 1
		lines:
			cue: show_won_turns
			1: First *Bierdeckel* of the night. Somebody frame it.
			2: Somebody frame his face when he loses.
			wait_for_cards_played: 2
			2: No *hearts* for me... again.

		when: round_end
		round: 1
		lines:
			cue: show_life_cards
			2: Well, that makes me the *loser*...
			2: Fine. Tradition is tradition. I'm getting the *drinks*.
			1: Awesome idea *Manfred*... 
			1: Cheers!
			2: Cheers.
			cue: show_drink_round
			1: Alright, next round!

		when: turn_start
		round: 2
		turn: 2
		lines: 
			1: *{player}* you are doing great!
			1: This is *fun*.
			2: Shush, *Bernd*! *{player}* is not a child.
			1: Yes, yes...

		when: turn_start
		round: 2
		turn: 4
		lines: 
			1: I will *smoke* a *cigarette* if that is fine for everybody.
			cue: show_cigs
			2: Sure, I would also smoke one.
			cue: ai_one_smokes
			2: Can I use your *lighter*?
			1: Again? Buy your own one day.
			cue: ai_two_smokes

		when: round_start
		round: 3
		lines:
			wait_for_cards_played: 2
			2: Finally, the good stuff.
			1: You say that about everything that burns.

		when: turn_start
		round: 3
		turn: 3
		lines:
			1: Well, beat *this*!
			wait_for_cards_played: 1
			2: Hold that thought, Bernd. This calls for a *cigarette*.

		when: match_won
		lines:
			cue: show_purse
			1: Well, this was the first match and I lost...
			2: Let's count this as the *trial round*, hehe.

		when: match_lost
		lines:
			1: Ha! I won one! Manfred, write it down.
			2: Next to the other one. From 1994.

		when: run_lost
		lines:
			1: Hey, no shame, *{player}*. First night at this table.
			2: First night is free. After that we take it personally.
			1: Grab a drink and sit back down. The chair's not going anywhere.

match: 2
	dialogues:
		when: match_start
		lines:
			2: Alright, let's make it interesting. Real *money* this time.
			1: And of course *I* pay in. Last night's loser.
			cue: ai_1_pays
			1: Let's hope it's not me again...
			wait_for_cards_played: 1
			1: Ahh *{player}* ...
			cue: give_player_cigs 3
			1: Have some of my *cigarettes*. On the house.
			2: His house. Which is mostly this bar.
			1: Hope you packed some *smoking cards*, {player}.
			2: Don't encourage the kid. We want to *win*.

		when: zero_played
		lines:
			2: Ooh, a *0*. Careful with your *9s*, Bernd.
			1: Don't start. I didn't sleep for a week last time.
			2: Best week of my life.

		when: round_start
		round: 2
		lines:
			cue: unlock_cig_automat
			Bar: Jo guys, the *cigarette machine* works again, in case somebody needs more.
			1: Awesome, I ran out of *cigarettes*. Let me quickly buy some.
			cue: ai_1_buys_cigarettes
			2: You bought a pack yesterday.
			1: And it's a new day, Manfred.

		when: zero_beats_nine
		lines:
			1: Ugh, I knew it, and I still fell for it.
			2: Every time, Bernd. Every single time.

		when: match_won
		lines:
			1: Well. There goes the *pot*.
			2: Into *{player}*'s pocket. Spend it wisely.
			1: Spend it *here*, he means.

		when: match_lost
		lines:
			2: And the money stays at the table. As it should.
			1: Easy come, easy go, *{player}*.

		when: run_lost
		lines:
			1: Don't look so sad. It's only money.
			2: Says the man who owes the *cigarette machine* three euros.
			1: Here, one for the road. Helps, trust me.
			2: Everything helps, according to him.

match: 3
	dialogues:
		when: match_start
		lines:
			2: Cigarettes alone are a sad hobby. Let's get some *drinks* going.
			cue: show_drinks
			1: Says the man who orders before he sits down.
			2: I'm efficient.

		when: alk_played
		lines:
			1: A *drinking card*! Somebody came thirsty.

		when: match_won
		lines:
			1: Phew, my *hearts 7* looked like a *5* after those drinks.
			2: The *boosters* have *drinking cards* now, {player}. Just saying.
			1: He's recruiting. Don't listen to him.

		when: match_lost
		lines:
			1: Out! Bartender, that one's on me!
			2: Everything's on you, Bernd. That's why you're broke.

		when: run_lost
		lines:
			2: Leaving already? The night's still young.
			1: The night's always young in here. We're the ones who got old.
			2: Go sleep it off, *{player}*. We'll save your glass.
			1: Don't save it. I'll drink it.

match: 4
	dialogues:
		when: match_start
		lines:
			1: *{player}*! Sit, sit. We kept your chair warm.
			2: He kept the *ashtray* warm.
			cue: ai_one_smokes
			1: First one of the evening. Doesn't count.
			2: You said that about the last three.
			1: Here *{player}*, have a few. Nobody smokes alone at this table.
			cue: give_player_cigs 2
			2: Leave the kid alone, Bernd.
			2: ...unless the kid is buying.

		when: round_start
		round: 2
		lines:
			2: Bartender! Same again. And one for *{player}*.
			1: Manfred, it's barely dark outside.
			2: It's dark somewhere.

		when: turn_start
		round: 2
		turn: 3
		lines:
			1: Where's my *lighter*? Who took my lighter?
			2: It's in your hand, Bernd.
			1: ...I knew that. I was testing you.

		when: round_start
		round: 3
		lines:
			1: Just this round. Then I'm switching to *water*.
			2: He's been switching to water since 1998.
			1: Water's for fish, Manfred.

		when: zero_played
		lines:
			2: A *0*! Bernd, your *9s*...
			1: Can't hear you. I'm *smoking*.

		when: alk_played
		lines:
			2: Now we're talking. *{player}*, that could be you.
			1: Leave it, Manfred. ...Or don't.

		when: match_won
		lines:
			2: Same time tomorrow?
			1: Same time every day, Manfred. That's the problem.
			1: Tomorrow's the big one, *{player}*. Bring your thirst.

		when: match_lost
		lines:
			1: Out. Ha. Out...
			2: Don't gloat, Bernd. Your hands are shaking.

		when: run_lost
		lines:
			1: Wait, *{player}*. Sit. One more. Just one.
			2: Leave it. They've got somewhere to be.
			1: Somewhere. Huh. Remember having somewhere, Manfred?
			2: No.
			Bar: Same again, gentlemen?
			2: Same again.

match: 5
	dialogues:
		when: match_start
		lines:
			Bar: Last round tonight, gentlemen. And I mean it this time.
			1: Says that every night.
			2: Big pot tonight. Bernd's whole *pension*.
			1: Half of it. The other half is in that *ashtray*.
			cue: ai_two_smokes
			1: You used to tell me to leave the new one alone, Manfred.
			2: I used to do a lot of things.
			2: *{player}*, one with us. For luck. One won't kill you.
			1: Won't kill you *fast*, anyway.
			cue: give_player_cigs 3

		when: round_start
		round: 2
		lines:
			cue: show_drink_round
			2: Round's on me. Don't look at me like that, Bernd.
			1: I'm not looking. I'm *counting*.
			2: *{player}*, you're not drinking? You make us look bad.

		when: turn_start
		round: 2
		turn: 4
		lines:
			1: My hands are shaking. It's the cards. Cheap cards.
			2: It's not the cards, Bernd.
			1: ...Pass me a *cigarette*.

		when: round_start
		round: 3
		lines:
			1: You're good, *{player}*. Too good. Have a *drink*, even it out.
			2: Come on. It's warmer over here with us.

		when: alk_played
		lines:
			1: Ahh, *drinking cards*. My people.
			2: Your only people, Bernd.

		when: match_won
		lines:
			1: Well... beaten by the new kid.
			2: Thirty years at this table, and the kid takes the pot.

		when: match_lost
		lines:
			2: That's it, then.
			1: Pot stays here. Like us.

		when: run_lost
		lines:
			Bar: That's you done, *{player}*. Go home.
			1: Home? It's warm here. Stay. Watch, at least.
			cue: ai_one_smokes
			2: Look at them, Bernd. Halfway out the door.
			1: We were like that once.
			2: Same chair tomorrow, *{player}*. You know where.
			1: Everybody comes back. That's the thing about this table.

match: any
	dialogues:
		when: match_won
		lines:

		when: tie_played
		lines:
			1: Same card? *Copycat*.
			2: I played it *first*. You're the copycat.

		when: round_tie
		lines:
			1: A *tie*? Not again...
			2: Shut up and *draw*, Bernd.

		when: run_won
		lines:
			Bar: Closing time, boys.
			1: Already? *{player}*, stay. One more game. One more *drink*.
			2: Let them go, Bernd.
			1: I am. I'm just asking.
			cue: ai_one_smokes
			2: ...Same table tomorrow, *{player}*?
			1: We'll be here. We're always here.

match: 2
	dialogues:
		when: first_smoke
		lines:
			1: There it is. Welcome to the club, *{player}*.
			2: The club has two members and a cough.

		when: bought_booster
		lines:
			1: New cards? Manfred, they're taking this seriously.
			2: Good. Somebody at this table should.

		when: bought_cigs
		lines:
			1: Your own pack! Look, Manfred, they grow up so fast.
			2: Don't cry on the cards, Bernd.

match: 3
	dialogues:
		when: first_smoke
		lines:
			1: Ha! Took you long enough.
			2: Careful. He'll start charging rent on your lungs.

		when: first_drink
		lines:
			2: *Prost*, *{player}*! First one's the hardest.
			1: First one's the easiest. It's the twentieth that's hard.

		when: round_by_you
		lines:
			1: *{player}* is buying! I like this one, Manfred.
			2: You like everybody who's buying.

		when: bought_booster
		lines:
			2: More cards. Any good ones in there?
			1: He means *drinking cards*. He always means drinking cards.

		when: bought_cigs
		lines:
			2: Machine took your money? It takes his every night.
			1: We have an understanding, the machine and me.

match: 4
	dialogues:
		when: first_smoke
		lines:
			1: Finally. I was starting to feel judged.
			2: You were judged, Bernd. You still are.

		when: first_drink
		lines:
			2: Look who finally joined us.
			1: Don't make a fuss, Manfred. ...*Prost*!

		when: bought_booster
		lines:
			1: Spending it all on cardboard? Spend it on us.
			2: He means on *drinks*.

		when: bought_cigs
		lines:
			1: Ooh. Lend us one? I'll pay you back.
			2: He won't.

match: 5
	dialogues:
		when: first_smoke
		lines:
			2: ...Huh. Tonight of all nights.
			1: Don't look at it like that, Manfred. Look at it like *family*.

		when: smoked
		lines:
			1: Good. Good. Now we're a proper table.
			2: Three ashtrays and a deck of cards. Proper.

		when: first_drink
		lines:
			2: There. Warmer, isn't it?
			1: Manfred...
			2: What? I'm being *friendly*.

		when: round_by_you
		lines:
			2: That's the spirit. See, Bernd? I said they'd come round.
			1: You said a lot of things, Manfred.

		when: round_by_bernd
		lines:
			1: One more *round*. For... for the road.
			2: You don't have a road, Bernd.

		when: round_by_manfred
		lines:
			2: *Round*. Don't count them, Bernd.
			1: Somebody has to.

		when: bought_booster
		lines:
			2: Buying cards. Like that'll help.
			1: Let them, Manfred. Everybody needs something to hold on to.

		when: bought_cigs
		lines:
			1: Good. Keep them close. You'll want them later.
			2: He'll want them later. He's out by ten.

		when: bought_stamp
		lines:
			1: Stamping cards. On a night like this.
			2: Let them, Bernd. Some of us still plan ahead.

match: any
	dialogues:
		when: first_smoke
		lines:
			1: Look at that, Manfred. One of us.
			2: Don't sound so happy about it.

		when: smoked
		lines:
			1: Another one? Now you're getting it.
			2: Getting what, Bernd?
			1: ...It.

		when: smoked
		lines:
			2: Bernd, they smoke faster than you now.
			1: Nobody smokes faster than me. ...Give me a second.

		when: smoked
		lines:
			1: Pass the *lighter* when you're done. Mine's... somewhere.
			2: In your other hand.

		when: first_drink
		lines:
			2: *Prost*. Welcome to the table. The real one.

		when: round_by_you
		lines:
			1: A *round* from *{player}*? *Prost*, everybody!
			2: Finally somebody with manners.

		when: round_by_you
		lines:
			2: *{player}*'s buying! Bernd, act surprised.
			1: I'm not surprised. I'm *thirsty*.

		when: round_by_you
		lines:
			1: Look at that, Manfred. Generosity.
			2: Don't get used to it.
			1: Too late.

		when: round_by_bernd
		lines:
			1: Bartender! A *round* for the whole table! Everybody drinks!

		when: round_by_bernd
		lines:
			1: *Round*'s on me. Don't tell my wife.
			2: She left in '03, Bernd.
			1: Then don't tell her anything.

		when: round_by_bernd
		lines:
			1: *Prost*! Bottoms up, all of you!
			2: He's paying with my money, by the way.

		when: round_by_manfred
		lines:
			2: This *round* is on me. Bottoms up.

		when: round_by_manfred
		lines:
			2: Bartender. Same again, for everyone.
			1: Thirty years and he's never once said "something else".

		when: round_by_manfred
		lines:
			2: A *round*. For my health.
			1: Your *what*?

		when: bought_booster
		lines:
			1: New cards. Shuffle them well, they're shy.

		when: bought_cigs
		lines:
			1: Fresh pack? Best sound in the world, that crinkle.
			2: Second best. After the cork.

		when: bought_stamp
		lines:
			2: Stamped your cards? Bernd marks his with ash.
			1: It's a system.

		when: bought_stamp
		lines:
			1: Fancy. In my day we just bent the corners.
			2: You still do. We all know which one's your *9*.

match: 2
	dialogues:
		when: turn_start
		round: 3
		turn: 2
		lines:
			1: Horst was at the bar again. You see him, *{player}*?
			2: Hard to miss. Counting the coasters.
			1: He used to sit right there. In your chair.

		when: sold_to_horst
		lines:
			1: You sold cards to *Horst*? Did he cough on them?
			2: He coughs on everything. It's how he marks them.

match: 3
	dialogues:
		when: round_start
		round: 2
		lines:
			2: Horst bought my old deck. With money I gave him.
			1: Why would you give *Horst* money?
			2: He asked. He coughed the whole time, but he asked.

		when: sold_to_horst
		lines:
			2: Feeding the shoebox, *{player}*?
			1: Don't. Every card you give him, he talks to.

match: 4
	dialogues:
		when: turn_start
		round: 3
		turn: 2
		lines:
			1: Best player in this bar, *Horst*. Hands like a surgeon.
			2: Now they shake like yours.
			1: ...Play your card, Manfred.

		when: sold_to_horst
		lines:
			1: Back from *Horst*? Did he ask about us?
			2: He never asks about us, Bernd.
			1: ...No. Course not.

match: 5
	dialogues:
		when: turn_start
		round: 3
		turn: 4
		lines:
			1: *{player}*. Got a *smoke*?
			2: ...You sound like Horst.
			1: Don't.
			2: Exactly like him, Bernd.

		when: sold_to_horst
		lines:
			2: How's Horst?
			1: Same as always. That's the problem.
			2: Same as us, you mean.

match: any
	dialogues:
		when: sold_to_horst
		lines:
			1: Selling to *Horst*? He'll outlive us all, that one.
			2: He won't. He just looks like he's trying.
